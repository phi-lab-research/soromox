name: Test

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  rendering-ubuntu:
    name: Native rendering (Ubuntu ${{ matrix.architecture }}, Python ${{ matrix.python }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86-64
            runner: ubuntu-latest
            python: '3.15'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      SOROMOX_OPEN3D_CACHE: ${{ github.workspace }}/.cache/soromox/open3d
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Open3D build, graphics, display, and video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential cmake ninja-build glslang-tools \
            xorg-dev libxcb-shm0 libglu1-mesa-dev libssl-dev \
            libc++-dev libc++abi-dev libsdl2-dev libxi-dev libtbb-dev \
            libegl1-mesa-dev libudev-dev libusb-1.0-0-dev mesa-vulkan-drivers \
            autoconf libtool clang gfortran xvfb xauth ffmpeg gdb

      - name: Select Mesa software Vulkan
        run: |
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$lavapipe_icd"
          echo "VK_DRIVER_FILES=$lavapipe_icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$lavapipe_icd" >> "$GITHUB_ENV"

      - name: Restore native Open3D build cache
        uses: actions/cache@v5
        with:
          path: ${{ env.SOROMOX_OPEN3D_CACHE }}
          key: rendering-ubuntu-${{ matrix.architecture }}-open3d-py${{ matrix.python }}-${{ hashFiles('third_party/open3d/**') }}

      - name: Build Open3D and install rendering tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./third_party/open3d
          python -m pip install -e ".[rendering,test]"

      - name: Diagnose native bounding geometry crash
        run: |
          lscpu
          gdb --batch -ex run -ex 'thread apply all bt 12' -ex 'x/12i $pc-16' \
            --args python -m pytest -xvs \
            tests/third_party/test_open3d_build_backend.py::test_bounding_geometry_preserves_transformed_cuboid
